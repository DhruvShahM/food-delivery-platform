server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Kong if needed (optional, can be handled by Ingress)
    # location /api/ {
    #     proxy_pass http://kong:8000/;
    # }
}
