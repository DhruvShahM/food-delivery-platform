jobs:
  # ===== QUALITY GATES =====
  lint-and-format:
    name: 'Lint & Format Check'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Check Go formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

  # ===== UNIT TESTS =====
  unit-tests:
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fooddb
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Generate Protobuf files
      run: make proto-all
    
    - name: Run unit tests
      run: make test-all
    
    - name: Run unit benchmarks
      run: make benchmark-unit

  # ===== BUILD =====
  build:
    name: 'Build Services'
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        service: [auth-service, order-service, payment-service, restaurant-service, delivery-service, tracking-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Build ${{ matrix.service }}
      run: |
        cd services/${{ matrix.service }}
        go mod tidy
        go build -o bin/server ./cmd/server
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.service }}-binary
        path: services/${{ matrix.service }}/bin/server
        retention-days: 30

  # ===== INTEGRATION TESTS =====
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Start infrastructure
      run: |
        docker compose up -d postgres redis zookeeper kafka
        sleep 30
    
    - name: Run integration tests
      run: make benchmark-integration
    
    - name: Run load tests
      run: make benchmark-load
    
    - name: Generate test report
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Integration tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "- Load tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY

  # ===== DEPLOY STAGING =====
  deploy-staging:
    name: 'Deploy to Staging'
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Deploy notification
      run: echo "🚀 Deploying to staging environment..."

  # ===== DEPLOY PRODUCTION =====
  deploy-production:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Deploy notification
      run: echo "🚀 Deploying to production environment..."