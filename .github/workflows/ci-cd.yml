name: CI/CD Pipeline

# Push/PR Triggers (Automatic)
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - 'common/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'docker-compose.yml'
      - 'kong.yml'
      - 'openapi.yaml'
      - '.github/workflows/**'
  
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/**'
      - 'common/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'docker-compose.yml'
      - 'kong.yml'
      - 'openapi.yaml'
      - '.github/workflows/**'

# Environment variables
env:
  GO_VERSION: '1.21'

jobs:
  # ===== QUALITY GATES =====
  lint-and-format:
    name: 'Lint & Format Check'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Check Go formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

  # ===== UNIT TESTS =====
  unit-tests:
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fooddb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Make scripts executable
      run: |
        chmod +x *.sh
        chmod +x scripts/*.sh
        find services -name "*.sh" -exec chmod +x {} \;
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Install PowerShell
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common
        wget -q "https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y powershell
    
    - name: Enable memory overcommit for Redis
      run: sudo sysctl vm.overcommit_memory=1
    
    # Set up database schema
    - name: Set up test database schema
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d fooddb -f scripts/init-db.sql
    
    # Override database credentials for CI/CD
    - name: Set CI database credentials
      run: |
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DB_NAME=fooddb" >> $GITHUB_ENV
    
    - name: Generate Protobuf files
      run: pwsh generate-proto.ps1
    
    - name: Run unit tests
      run: ./test-all-services.sh
    
    - name: Run unit benchmarks
      run: ./benchmark-unit.sh
  # ===== BUILD =====
  build:
    name: 'Build Services'
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        service: [auth-service, order-service, payment-service, restaurant-service, delivery-service, tracking-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4          
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          go-mod-${{ runner.os }}-
    
    - name: Build ${{ matrix.service }}
      run: |
        cd services/${{ matrix.service }}
        go mod tidy
        go build -o bin/server ./cmd/server
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.service }}-binary
        path: services/${{ matrix.service }}/bin/server
        retention-days: 30

  # ===== INTEGRATION TESTS =====
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Start infrastructure
      run: |
        docker compose up -d postgres redis zookeeper kafka
        sleep 30
    
    - name: Run integration tests
      run: make benchmark-integration
    
    - name: Run load tests
      run: make benchmark-load
    
    - name: Generate test report
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Integration tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "- Load tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY

  # ===== DEPLOY STAGING =====
  deploy-staging:
    name: 'Deploy to Staging'
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Deploy notification
      run: echo "🚀 Deploying to staging environment..."

  # ===== DEPLOY PRODUCTION =====
  deploy-production:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Deploy notification
      run: echo "🚀 Deploying to production environment..."