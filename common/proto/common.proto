syntax = "proto3";

package common;

option go_package = "food-delivery-platform/common/proto";

message OrderEvent {
  string order_id = 1;
  string user_id = 2;
  string restaurant_id = 3;
  string status = 4;
  double amount = 5;
  string timestamp = 6;
}

message Location {
  double lat = 1;
  double lng = 2;
  string timestamp = 3;
}

message MenuItem {
  string id = 1;
  string name = 2;
  double price = 3;
  bool available = 4;
}